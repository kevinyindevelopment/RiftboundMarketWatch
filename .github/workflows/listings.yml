# Hourly TCGplayer listings poll — feeds the deals tracker.
#
# Separate from sales.yml on purpose: sales are an immutable historical record we
# accumulate, listings are an ephemeral snapshot we replace. Mixing them would
# mean a failure in one silently degrading the other.
#
# Only watched products are polled (Epic/Showcase rarity, or worth over $1):
# ~633 of 1,534. A deal on a five-cent common is not actionable.
name: Poll TCGplayer listings

on:
  schedule:
    # :05 — staggered away from sales (:35) and the daily price ingest (21:15)
    # so the three jobs never contend on the same Neon compute.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only poll the first N watched products (testing)"
        required: false
        type: string

concurrency:
  group: poll-listings
  cancel-in-progress: false

jobs:
  listings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Poll listings
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            npm run ingest:listings -- --limit "${{ inputs.limit }}"
          else
            npm run ingest:listings
          fi
