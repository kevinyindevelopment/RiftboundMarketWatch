# Hourly TCGplayer sales poll — the price signal of record for this site.
#
# Upstream exposes only the 5 most recent sales per product and ignores paging,
# so depth is ACCUMULATED: poll hourly, store what's new, and compute the price
# from our own history. Skipping runs loses sales permanently for any card that
# traded more than 5 times in the gap.
name: Poll TCGplayer sales

on:
  schedule:
    # Hourly, offset off the hour so it doesn't collide with the daily price
    # ingest at 21:15 UTC (both write to the same Neon compute).
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only poll the first N products (testing)"
        required: false
        type: string

# Never overlap: two sweeps would double the load on an undocumented upstream
# endpoint and contend on the same writes.
concurrency:
  group: poll-sales
  cancel-in-progress: false

jobs:
  sales:
    runs-on: ubuntu-latest
    # A sweep is minutes, not tens of minutes. A low ceiling means a wedged run
    # is killed before the next hourly one queues behind it.
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Poll sales
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            npm run ingest:sales -- --limit "${{ inputs.limit }}"
          else
            npm run ingest:sales
          fi
